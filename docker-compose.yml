version: "3.8"

services:
  capsule:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - CAPSULE_MODEL=${CAPSULE_MODEL:-qwen2.5-coder:7b}
      - CAPSULE_API_BASE=${CAPSULE_API_BASE:-}
    volumes:
      - ./capsule_output:/app/capsule_output
      - ./dependency-exit-capsule/target:/app/dependency-exit-capsule/target
    restart: unless-stopped
